name: Validate build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Capture bootstrap lockfile
        run: |
          echo '===CHEATORDIE_LOCK_START==='
          cat package-lock.json
          echo '===CHEATORDIE_LOCK_END==='
      - name: Typecheck and build
        run: npm run build
